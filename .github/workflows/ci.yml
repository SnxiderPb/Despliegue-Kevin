name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Pruebas unitarias e integración
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ejecutar pruebas
        run: npm test
