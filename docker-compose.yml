services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-despliegue}
      POSTGRES_USER: ${DB_USER:-despliegue}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-despliegue} -d ${DB_NAME:-despliegue}"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-database:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: despliegue_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d despliegue_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-despliegue}
      DB_USER: ${DB_USER:-despliegue}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD in .env}
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
